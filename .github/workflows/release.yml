name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build -c release --arch arm64

      - name: test
        run: swift test -c release --arch arm64

      - name: real Parakeet model smoke
        run: .build/arm64-apple-macosx/release/parrot models smoke parakeet-tdt-0.6b-v2

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/parrot
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/parrot
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh
          APP_VERSION=$(dist/parrot --version)
          BUNDLE_VERSION=$(plutil -extract CFBundleShortVersionString raw AppBundle/Info.plist)
          test "$APP_VERSION" = "$BUNDLE_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$APP_VERSION" = "${GITHUB_REF_NAME#v}"
          fi

      - name: strip
        run: strip -x dist/parrot

      - name: build signed app bundle
        run: |
          mkdir -p dist/Parrot.app/Contents/MacOS dist/Parrot.app/Contents/Resources
          cp AppBundle/Info.plist dist/Parrot.app/Contents/Info.plist
          cp dist/parrot dist/Parrot.app/Contents/MacOS/parrot
          scripts/build-app-icon.sh \
            AppBundle/ParrotAppIcon.png \
            dist/Parrot.app/Contents/Resources/Parrot.icns
          chmod +x dist/Parrot.app/Contents/MacOS/parrot
          test "$(plutil -extract CFBundleIconFile raw dist/Parrot.app/Contents/Info.plist)" = "Parrot.icns"
          test -s dist/Parrot.app/Contents/Resources/Parrot.icns
          codesign --force --deep --sign - \
            --identifier com.digimata.parrot \
            --requirements '=designated => identifier "com.digimata.parrot"' \
            dist/Parrot.app
          codesign --verify --deep --strict --verbose=2 dist/Parrot.app
          codesign -d --requirements - dist/Parrot.app 2>&1 | grep 'identifier "com.digimata.parrot"'

      - name: package
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot Parrot.app
          tar -tzf parrot-macos-arm64.tar.gz | grep -Fx 'Parrot.app/Contents/Resources/Parrot.icns'
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          shasum -a 256 install.sh > install.sh.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/install.sh
            dist/install.sh.sha256
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
